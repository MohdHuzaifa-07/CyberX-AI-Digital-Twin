<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cyber Sentinel</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Cyber Sentinel Hub</h1>
        <nav class="auth-nav">
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </nav>
    </header>

    <div class="center-wrapper">
        <div class="glass-container auth-form">
            <h2>Log In</h2>
            {% if error %}
                <div style="background: rgba(255, 68, 68, 0.1); border: 1px solid #ff4444; color: #ff6666; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem;">
                    {{ error }}
                </div>
            {% endif %}
            <form action="/login" method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary">Authenticate</button>
            </form>
            <div class="footer-link">
                <p>Don't have an access key? <a href="/register">Register here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
